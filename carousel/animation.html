<!DOCTYPE html>
<html lang="ja">
    <body>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
            <title>カルーセルを作ろう</title>
            <link rel="stylesheet" href="styles/styles.css">
        </head>
        <main>
            <h1>カルーセルを頑張ってみる</h1>
            <section class="slider">
                <div class="sliderAria">
                    <div class="slider0 position0"><p>slider0</p></div>
                    <div class="slider1 position1"><p>slider1</p></div>
                    <div class="slider2 position2"><p>slider2</p></div>
                    <div class="slider3 position3"><p>slider3</p></div>
                    <div class="slider4 position4"><p>slider4</p></div>
                    <div class="slider5 position5"><p>slider5</p></div>
                    <div class="slider6 position6"><p>slider6</p></div>
                </div>
                <div class="btnAria">
                    <button id="prev"></button>
                    <button id="back"></button>
                </div>
            </section>
            <section class="description">
                <h2>解説</h2>
                <p>
                    学校のグループ課題にスライダー機能が含まれていたため、作成したもの。<br>
                    以下の要件を満たす
                </p>
                <ol>
                    <li>左右のボタンで隣の画像に動かせる</li>
                    <li>画像は1，2，3，4，5，1，2…のようにぐるぐる回る</li>
                    <li>アニメーションで動く</li>
                </ol>
                <p>
                    上記のサンプルはわかりやすくするため、見える範囲は絞っていない。
                </p>
            </section>
        </main>
        <footer>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="scripts/slider.js"></script>
    </body>
</html>
